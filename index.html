<script>
/* =====================================================================
   PART 1 - Pure physics (NO Phaser inside).
   Later this exact class can run on the Node.js server for anti-cheat.
   ===================================================================== */
const W = 1280, H = 720;
const L = 140, T = 110, R = 1140, B = 610;      // cushion surface (play area)
const CX = (L + R) / 2, CY = (T + B) / 2;
function mkHoleMask(scene, p) { const g = scene.make.graphics({ x: 0, y: 0, add: false }); g.fillStyle(0xffffff, 1); g.fillCircle(p.x, p.y, p.r); return g.createGeometryMask(); }
const BR = 14.706;                                   // ball radius
/* ---- Pocket geometry (all sizes are multiples of the ball diameter DB) ----
   CORNER pockets: a straight channel. Both walls are parallel to the pocket axis (45 deg to the rail),
     clear width MOUTH_C at the start AND at the end of the walls, wall length CORNER_WALL_LEN.
   SIDE pockets: a trapezoid (funnel). Clear mouth MOUTH_S between the knuckles, walls lean SIDE_WALL_ANGLE-90 degrees
     from perpendicular so the funnel narrows to SIDE_BACK_W at its end.
   HOLE (the pocket circle): a ball is pocketed when its CENTRE gets inside the circle.
     CORNER: diameter CORNER_HOLE_D, centre CORNER_HOLE_OFF outside the corner where the two cushions meet (on the diagonal).
     SIDE:   diameter SIDE_HOLE_D,   centre SIDE_HOLE_OFF outside the cushion line.
   E_CHEEK = bounciness of the pocket walls. */
const DB = 2 * BR;                                   // ball diameter
const JAW_R = 6, E_JAW = 0.6, E_CHEEK = 0.5;
const MOUTH_C = 1.84 * DB, MOUTH_S = 2.0 * DB;
const CORNER_WALL_LEN = 0.73 * DB;
const SIDE_BACK_W = 1.62 * DB, SIDE_WALL_ANGLE = 105 * Math.PI / 180;
const MOUTH_CLEAR = 30;   // drawing only: no cushion shadow in front of a pocket mouth, this many px into the table
const CORNER_HOLE_D = 2.23 * DB, CORNER_HOLE_OFF = 0.69 * DB;
const SIDE_HOLE_D = 1.67 * DB, SIDE_HOLE_OFF = 0.9 * DB;
const JC = (MOUTH_C + 2 * JAW_R) / Math.SQRT2 - JAW_R;   // corner knuckle distance from the corner, along the rail
const JS = MOUTH_S / 2 + JAW_R;                          // side knuckle distance from the table centre
// each knuckle is tangent to the cushion line, so a ball sliding along the rail passes it with no bump
const JAWS = [
  { x: L + JC, y: T - JAW_R }, { x: L - JAW_R, y: T + JC },
  { x: R - JC, y: T - JAW_R }, { x: R + JAW_R, y: T + JC },
  { x: L + JC, y: B + JAW_R }, { x: L - JAW_R, y: B - JC },
  { x: R - JC, y: B + JAW_R }, { x: R + JAW_R, y: B - JC },
  { x: CX - JS, y: T - JAW_R }, { x: CX + JS, y: T - JAW_R },
  { x: CX - JS, y: B + JAW_R }, { x: CX + JS, y: B + JAW_R }
];
/* Pocket walls (line segments, a ball bounces off them at distance BR) and the pockets themselves.
   Built from the numbers above: each wall starts where it touches its knuckle, so the knuckle rounds the entrance. */
const WALLS = [], POCKETS = [];
(function buildPockets() {
  const k = Math.SQRT1_2, r = JAW_R;
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {            // corners
    const Cx = sx < 0 ? L : R, Cy = sy < 0 ? T : B;
    const ux = sx * k, uy = sy * k, px = sx * k, py = -sy * k;               // u = outward axis, p = across the axis
    const K1 = { x: Cx - sx * JC, y: Cy + sy * r }, K2 = { x: Cx + sx * r, y: Cy - sy * JC };
    const A1 = { x: K1.x + px * r, y: K1.y + py * r }, A2 = { x: K2.x - px * r, y: K2.y - py * r };
    const B1 = { x: A1.x + ux * CORNER_WALL_LEN, y: A1.y + uy * CORNER_WALL_LEN };
    const B2 = { x: A2.x + ux * CORNER_WALL_LEN, y: A2.y + uy * CORNER_WALL_LEN };
    WALLS.push({ x1: A1.x, y1: A1.y, x2: B1.x, y2: B1.y }, { x1: A2.x, y1: A2.y, x2: B2.x, y2: B2.y });
    const hx = Cx + ux * CORNER_HOLE_OFF, hy = Cy + uy * CORNER_HOLE_OFF, tv = (hx - A1.x) * ux + (hy - A1.y) * uy;   // drawing only: run the channel into the hole
    const V1 = { x: A1.x + ux * tv, y: A1.y + uy * tv }, V2 = { x: A2.x + ux * tv, y: A2.y + uy * tv };
    const S1 = { x: A1.x - ux * 4, y: A1.y - uy * 4 }, S2 = { x: A2.x - ux * 4, y: A2.y - uy * 4 };   // drawing only: start a little inside the table so the cut reaches the cushion
    const k1 = (A1.y - Cy) / uy, k2 = (A2.x - Cx) / ux;                       // where each wall meets the cushion line (drawing only)
    const edges = [
      { x1: A1.x - ux * k1, y1: A1.y - uy * k1, x2: V1.x, y2: V1.y, nx: px, ny: py, rx: -sx, ry: 0 },
      { x1: A2.x - ux * k2, y1: A2.y - uy * k2, x2: V2.x, y2: V2.y, nx: -px, ny: -py, rx: 0, ry: -sy }
    ];
    const F1 = { x: A1.x - ux * MOUTH_CLEAR, y: A1.y - uy * MOUTH_CLEAR }, F2 = { x: A2.x - ux * MOUTH_CLEAR, y: A2.y - uy * MOUTH_CLEAR };
    POCKETS.push({ x: hx, y: hy, r: CORNER_HOLE_D / 2, poly: [S1, V1, V2, S2], polyF: [F1, V1, V2, F2], edges });
  }
  const ang = SIDE_WALL_ANGLE - Math.PI / 2, sa = Math.sin(ang), ca = Math.cos(ang);
  for (const sy of [-1, 1]) {                                                // side pockets
    const Cy = sy < 0 ? T : B, pts = [], ptsF = [], edges = [];
    for (const sg of [-1, 1]) {
      const K = { x: CX + sg * JS, y: Cy + sy * r };
      const w = { x: -sg * sa, y: sy * ca }, n = { x: -sg * ca, y: -sy * sa };   // w = wall direction (outward), n = toward the axis
      const A = { x: K.x + n.x * r, y: K.y + n.y * r };
      const len = (Math.abs(A.x - CX) - SIDE_BACK_W / 2) / sa;
      const Bp = { x: A.x + w.x * len, y: A.y + w.y * len };
      WALLS.push({ x1: A.x, y1: A.y, x2: Bp.x, y2: Bp.y });
      const tv = (Cy + sy * SIDE_HOLE_OFF - A.y) / (sy * ca);                          // drawing only: run the funnel into the hole
      const kb = (sy * (A.y - Cy) + 2) / ca;                                           // drawing only: start 2 px inside the table so the cut reaches the cushion
      pts.push({ x: A.x - w.x * kb, y: A.y - w.y * kb }, { x: A.x + w.x * tv, y: A.y + w.y * tv });
      const kf = (sy * (A.y - Cy) + MOUTH_CLEAR) / ca;                                 // drawing only: the floor of the mouth reaches MOUTH_CLEAR px into the table
      ptsF.push({ x: A.x - w.x * kf, y: A.y - w.y * kf });
      const k0 = sy * (A.y - Cy) / ca;                                                 // wall meets the cushion line (drawing only)
      edges.push({ x1: A.x - w.x * k0, y1: A.y - w.y * k0, x2: A.x + w.x * tv, y2: A.y + w.y * tv, nx: n.x, ny: n.y, rx: sg, ry: 0 });
    }
    POCKETS.push({ x: CX, y: Cy + sy * SIDE_HOLE_OFF, r: SIDE_HOLE_D / 2, poly: [pts[0], pts[1], pts[3], pts[2]], polyF: [ptsF[0], pts[1], pts[3], ptsF[1]], edges });
  }
})();
// cushion exists only between the knuckles; inside a mouth there is no wall
const onRailX = x => (x >= L + JC && x <= CX - JS) || (x >= CX + JS && x <= R - JC);
const onRailY = y => y >= T + JC && y <= B - JC;

/* ---- Physics feel ----
   Rolling friction is now 3-zone so the ball dies out smoothly (like the real game):
     fast (speed > SLOW): constant FRIC + speed-proportional DRAG  -> quick loss of energy right after the hit
     slow (speed <= SLOW): exponential decay (SLOWK per second) + a tiny constant TAILF -> long, soft glide to zero
   Tuning:
     ball dies too early at the end      -> lower SLOWK (e.g. 1.0) and/or lower TAILF (e.g. 2)
     ball glides too long at the end     -> raise SLOWK (e.g. 2.5) and/or raise TAILF
     too many cushion hits after a break -> raise DRAG (fast zone)
     total distance changed              -> adjust FRIC and DRAG together
   STOP = speed (px/s) below which the ball is set to exactly 0. */
const FRIC = 120, DRAG = 0.35, SLOW = 70, SLOWK = 1.4, TAILF = 2, STOP = 0.5;
const E_BALL = 0.97, E_WALL = 0.85, MAXV = 2600;
const STEP = 1 / 240;
const SFX_VOL = 0.45;   // master volume of the synthesized sounds (0..1)
/* Recorded sound effects (mono 16-bit WAV, 32 kHz, already trimmed so the attack starts at sample 0).
   SAMPLE_VOL = master volume of the recorded sounds, CUSHION_GAIN / POCKET_GAIN = extra level for the quieter cushion / pocket samples.
   If a sample fails to decode, the old synthesized sound is used instead. */

const RACK_GAP = 1.0, RACK_JITTER = 0.3;   // px: فاصله‌ی بین توپ‌ها و دامنه‌ی نویز
/* ---- Spin feel ----

   SPIN_K     strength of top / back spin at the edge of the spin dial

// first t >= 0 where a ball (radius rad) moving from (cx,cy) along unit (dx,dy) touches segment w; -1 if never
function raySegment(cx, cy, dx, dy, w, rad) {
  let best = -1;
  const take = t => { if (t >= 0 && (best < 0 || t < best)) best = t; };
  for (const [qx, qy] of [[w.x1, w.y1], [w.x2, w.y2]]) {            // the two end caps
    const fx = qx - cx, fy = qy - cy, bb = fx * dx + fy * dy, disc = bb * bb - (fx * fx + fy * fy - rad * rad);
    if (disc >= 0) take(bb - Math.sqrt(disc));
  }
  const ex = w.x2 - w.x1, ey = w.y2 - w.y1, len = Math.hypot(ex, ey), tx = ex / len, ty = ey / len, mx = -ty, my = tx;
  const dm = dx * mx + dy * my;
  if (Math.abs(dm) > 1e-9) for (const sg of [-1, 1]) {              // the two long sides
    const t = ((w.x1 - cx) * mx + (w.y1 - cy) * my + sg * rad) / dm;
    if (t < 0) continue;
    const along = (cx + dx * t - w.x1) * tx + (cy + dy * t - w.y1) * ty;
    if (along >= 0 && along <= len) take(t);
  }

  constructor() { this.balls = []; this.events = []; this.reset(); }

  reset() {

    this.balls = [{ n: 0, x: L + 250, y: CY, vx: 0, vy: 0, rvx: 0, rvy: 0, w: 0, active: true, rot: 0 }];

    for (let i = nums.length - 1; i > 0; i--) {

      [nums[i], nums[j]] = [nums[j], nums[i]];
    }
    nums.splice(4, 0, 8);                        // 8-ball in the middle of the rack

    for (let row = 0; row < 5; row++) {

this.balls.push({
  n: nums[k++],
  x: fx + row * (BR * Math.sqrt(3) + RACK_GAP) + jx,
  y: CY + (col - row / 2) * (2 * BR + RACK_GAP) + jy,

        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        const ov = (min - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; c.x += nx * ov; c.y += ny * ov;
        const vn = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
        if (vn > 0) {
          const j2 = (1 + E_BALL) / 2 * vn;
          a.vx -= j2 * nx; a.vy -= j2 * ny; c.vx += j2 * nx; c.vy += j2 * ny;
          this.events.push({ type: 'ball', v: vn, a: a.n, b: c.n });
        }
      }
    }
  }

  // first thing the cue ball would touch along a direction (for the aim guide)
  rayHit(dx, dy) {
    const c = this.balls[0];
    let best = { t: 1e9, kind: 'none', ball: null };
    // a wall only counts if the hit point lies on the cushion (not inside a pocket mouth)
    const tryWall = (t, vertical) => {
      if (t < 0 || t >= best.t) return;
      const hx = c.x + dx * t, hy = c.y + dy * t;
      if (vertical ? onRailY(hy) : onRailX(hx)) best = { t, kind: 'wall', ball: null };
    };
    if (dx > 1e-9) tryWall((R - BR - c.x) / dx, true);
    if (dx < -1e-9) tryWall((L + BR - c.x) / dx, true);
    if (dy > 1e-9) tryWall((B - BR - c.y) / dy, false);
    if (dy < -1e-9) tryWall((T + BR - c.y) / dy, false);
    for (const j of JAWS) {
      const fx = j.x - c.x, fy = j.y - c.y, bb = fx * dx + fy * dy;
      if (bb <= 0) continue;
      const disc = bb * bb - (fx * fx + fy * fy - (BR + JAW_R) * (BR + JAW_R));
      if (disc < 0) continue;
      const t = bb - Math.sqrt(disc);
      if (t >= 0 && t < best.t) best = { t, kind: 'jaw', ball: null };
    }
    for (const w of WALLS) {                          // pocket walls: a segment thickened by the ball radius
      const t = raySegment(c.x, c.y, dx, dy, w, BR);
      if (t >= 0 && t < best.t) best = { t, kind: 'jaw', ball: null };
    }
    for (let i = 1; i < this.balls.length; i++) {
      const b = this.balls[i]; if (!b.active) continue;
      const fx = b.x - c.x, fy = b.y - c.y;
      const bb = fx * dx + fy * dy; if (bb <= 0) continue;
      const cc = fx * fx + fy * fy - 4 * BR * BR;
      const disc = bb * bb - cc; if (disc < 0) continue;
      const t = bb - Math.sqrt(disc);
      if (t >= 0 && t < best.t) best = { t, kind: 'ball', ball: b };
    }
    if (best.kind === 'none') {                      // ray goes through a pocket mouth: stop the guide at the pocket
      for (const p of POCKETS) {
        const fx = p.x - c.x, fy = p.y - c.y, bb = fx * dx + fy * dy;
        if (bb > 0 && fx * fx + fy * fy - bb * bb < p.r * p.r && bb < best.t) best.t = bb;
      }
    }
    if (best.t > 1500) best.t = 1500;
    best.x = c.x + dx * best.t; best.y = c.y + dy * best.t;
    return best;
  }
}

/* =====================================================================
   PART 1b - 8-ball rules (pure logic, no Phaser).  Also meant to run on the server.
   A shot is judged from a log of what happened: [{type:'ball',a,b} | {type:'wall',n} | {type:'pocket',n}]
   `before` = Set of object-ball numbers that were on the table when the shot started.
   ===================================================================== */
class Rules {
  constructor() { this.reset(); }

  reset() {
    this.turn = 0;                 // who shoots next (0 or 1)
    this.groups = [null, null];    // 'solid' | 'stripe' once assigned; null = table is open
    this.breakShot = true;         // the next shot is the break
    this.ballInHand = true;        // break: cue ball placed behind the head string
    this.winner = -1;
  }

  rerack() { this.groups = [null, null]; this.breakShot = true; this.ballInHand = true; }   // same player breaks again

  static groupOf(n) { return n === 8 ? 'eight' : (n < 8 ? 'solid' : 'stripe'); }

  // what the shooter must hit first: 'any' (open table) | 'solid' | 'stripe' | 'eight'
  target(player, before) {
    const g = this.groups[player];
    if (!g) return 'any';
    for (const n of before) if (Rules.groupOf(n) === g) return g;
    return 'eight';
  }

  evaluate(log, before) {
    const me = this.turn, opp = 1 - me;
    const res = { foul: false, reason: '', continues: false, winner: -1, rerack: false, assigned: false, potted: [], scratch: false };
    let first = null, railAfterContact = false;
    const railBalls = new Set();
    for (const e of log) {
      if (e.type === 'ball') { if (first === null && (e.a === 0 || e.b === 0)) first = e.a === 0 ? e.b : e.a; }
      else if (e.type === 'wall') { if (e.n !== 0) railBalls.add(e.n); if (first !== null) railAfterContact = true; }
      else if (e.type === 'pocket') { if (e.n === 0) res.scratch = true; else res.potted.push(e.n); }
    }
    const potted = res.potted;
    const foul = why => { if (!res.foul) { res.foul = true; res.reason = why; } };

    if (this.breakShot && potted.includes(8)) { res.rerack = true; res.reason = '8-ball pocketed on the break: re-rack'; return res; }

    const target = this.breakShot ? 'any' : this.target(me, before);
    if (res.scratch) foul('cue ball pocketed');
    else if (first === null) foul('no ball was hit');
    else if (!this.breakShot) {
      const g = Rules.groupOf(first);
      if (target === 'any' ? g === 'eight' : g !== target) foul(target === 'eight' ? 'must hit the 8-ball first' : 'wrong ball hit first');
    }
    if (!res.foul && this.breakShot && potted.length === 0 && railBalls.size < 4) foul('illegal break (4 balls must reach a rail)');
    if (!res.foul && !this.breakShot && potted.length === 0 && !railAfterContact) foul('no ball reached a rail');

    if (potted.includes(8)) {          // game decided
      res.winner = (res.foul || target !== 'eight') ? opp : me;
      if (res.winner === opp) res.reason = res.foul ? res.reason : '8-ball pocketed too early';
      this.winner = res.winner; return res;
    }

    if (!res.foul && !this.breakShot && this.groups[me] === null) {      // open table: first pocketed ball picks the group
      const f = potted.find(n => n !== 8);
      if (f !== undefined) {
        const g = Rules.groupOf(f);
        this.groups[me] = g; this.groups[opp] = g === 'solid' ? 'stripe' : 'solid'; res.assigned = true;
      }
    }

    if (res.foul) { this.turn = opp; this.ballInHand = true; }
    else {
      const mine = this.groups[me];
      res.continues = this.breakShot ? potted.length > 0 : (mine !== null && potted.some(n => Rules.groupOf(n) === mine));
      if (!res.continues) this.turn = opp;
      this.ballInHand = false;
    }
    this.breakShot = false;
    return res;
  }
}

/* =====================================================================
   PART 2 - Procedural art (zero image files => tiny download)
   ===================================================================== */
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r); c.closePath();
}

function buildTextures(scene) {
  const tx = scene.textures, S = 96, m = S / 2;
  const cols = [null, '#f5c518', '#1d4ed8', '#dc2626', '#7e22ce', '#f97316', '#15803d', '#7f1d1d', '#111111'];

  for (let n = 0; n <= 15; n++) {
    if (tx.exists('ball' + n)) continue;
    const t = tx.createCanvas('ball' + n, S, S), c = t.getContext();
    const col = n === 0 ? '#ffffff' : cols[n > 8 ? n - 8 : n];
    c.save(); c.beginPath(); c.arc(m, m, m - 1, 0, Math.PI * 2); c.clip();
    if (n > 8) {
      c.fillStyle = '#f4f1e8'; c.fillRect(0, 0, S, S);
      c.fillStyle = col; c.fillRect(0, S * 0.22, S, S * 0.56);
    } else { c.fillStyle = col; c.fillRect(0, 0, S, S); }
    c.restore();
    if (n > 0) {
      c.fillStyle = '#fff'; c.beginPath(); c.arc(m + S * 0.14, m, S * 0.19, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#111'; c.font = 'bold 26px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(n), m + S * 0.14, m + 1);
    } else {
      c.fillStyle = '#d33'; c.beginPath(); c.arc(m + S * 0.18, m, S * 0.05, 0, Math.PI * 2); c.fill();
    }
    t.refresh();
  }

  if (!tx.exists('shine')) {            // static light on top of the rolling ball
    const t = tx.createCanvas('shine', S, S), c = t.getContext();
    c.save(); c.beginPath(); c.arc(m, m, m - 1, 0, Math.PI * 2); c.clip();
    let g = c.createRadialGradient(m - S * 0.08, m - S * 0.1, S * 0.15, m, m, m);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.65, 'rgba(0,0,0,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    g = c.createRadialGradient(m - S * 0.2, m - S * 0.24, 0, m - S * 0.2, m - S * 0.24, S * 0.2);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    c.restore(); t.refresh();
  }

  if (!tx.exists('shadow')) {
    const t = tx.createCanvas('shadow', S, S), c = t.getContext();
    const g = c.createRadialGradient(m, m, 0, m, m, m);
    g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.6, 'rgba(0,0,0,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0, 0, S, S); t.refresh();
  }

  if (!tx.exists('table')) {
    const t = tx.createCanvas('table', W, H), c = t.getContext();
    c.fillStyle = '#0b130f'; c.fillRect(0, 0, W, H);
    let g = c.createLinearGradient(0, T - 56, 0, B + 56);
    g.addColorStop(0, '#7a4a24'); g.addColorStop(0.5, '#5a3318'); g.addColorStop(1, '#3f230f');
    c.fillStyle = g; rr(c, L - 56, T - 56, R - L + 112, B - T + 112, 34); c.fill();
    c.strokeStyle = 'rgba(255,220,170,0.25)'; c.lineWidth = 2;
    rr(c, L - 54, T - 54, R - L + 108, B - T + 108, 32); c.stroke();
    /* cushions: darker base, a lighter face next to the playfield, a bright edge line and a soft shadow on the cloth
       (colours are easy to change: CUSHION_BASE / CUSHION_FACE / CUSHION_EDGE) */
    const CUSHION_BASE = '#0f4a2a', CUSHION_FACE = '#18733c', CUSHION_EDGE = '#4be07a', FACE_W = 10;
    c.fillStyle = CUSHION_BASE; rr(c, L - 24, T - 24, R - L + 48, B - T + 48, 14); c.fill();
    c.fillStyle = CUSHION_FACE;
    c.fillRect(L, T - FACE_W, R - L, FACE_W); c.fillRect(L, B, R - L, FACE_W);
    c.fillRect(L - FACE_W, T, FACE_W, B - T); c.fillRect(R, T, FACE_W, B - T);
    g = c.createRadialGradient(CX, CY, 60, CX, CY, 620);
    g.addColorStop(0, '#2f9a57'); g.addColorStop(1, '#1b6639');
    c.fillStyle = g; c.fillRect(L, T, R - L, B - T);
    const CUT_FILL = g;      // the pocket cut shows the table floor (the same cloth gradient)
    /* FLOOR = cloth rectangle + every pocket cut (the funnel / channel) + the pocket circle.
       The cut is painted with the SAME cloth gradient, so the pocket entrance is exactly the floor colour.
       ONE shadow pass is made from the shape of everything that is NOT floor (cushions, walls, jaws), so the shadow
       runs along the straight cushion, turns round the bend, follows the walls into the channel and goes on to the circle,
       with no break anywhere.  Tuning: SHADOW_A = darkness at the cushion edge, SHADOW_BLUR = how far the shadow reaches. */
    const SHADOW_A = 0.85, SHADOW_BLUR = 26;
    const mk = () => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; return cv; };
    const polyPath = (ctx, pts) => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); };
    // 1) cushion face along the cut walls, then the cut itself: crisp cloth between the walls
    for (const p of POCKETS) {
      c.save();
      c.beginPath(); c.rect(L - 24, T - 24, R - L + 48, B - T + 48); c.clip();
      c.strokeStyle = CUSHION_FACE; c.lineWidth = 2 * FACE_W; c.lineCap = 'butt';
      for (const e of p.edges) { c.beginPath(); c.moveTo(e.x1, e.y1); c.lineTo(e.x2, e.y2); c.stroke(); }
      c.restore();
      polyPath(c, p.poly); c.fillStyle = CUT_FILL; c.fill();
    }
    // 2) the one continuous cushion shadow
    const fm = mk(), fc = fm.getContext('2d');           // fm = the floor (opaque where there is floor)
    fc.fillStyle = '#fff'; fc.fillRect(L, T, R - L, B - T);
    for (const p of POCKETS) { polyPath(fc, p.poly); fc.fill(); fc.beginPath(); fc.arc(p.x, p.y, p.r, 0, Math.PI * 2); fc.fill(); }
    const sm = mk(), sc = sm.getContext('2d');           // sm = everything that is NOT floor
    sc.fillStyle = '#000'; sc.fillRect(0, 0, W, H);
    sc.globalCompositeOperation = 'destination-out'; sc.drawImage(fm, 0, 0);
    const sh = mk(), shc = sh.getContext('2d');          // sh = soft shadow of that shape, kept only on the floor
    shc.shadowColor = 'rgba(0,0,0,' + SHADOW_A + ')'; shc.shadowBlur = SHADOW_BLUR; shc.shadowOffsetX = W;
    shc.drawImage(sm, -W, 0);                            // drawn off-canvas, only its blurred shadow lands here
    shc.shadowColor = 'transparent'; shc.shadowBlur = 0; shc.shadowOffsetX = 0;
    shc.globalCompositeOperation = 'destination-in'; shc.drawImage(fm, 0, 0);
    c.drawImage(sh, 0, 0);
    // 3) bright cushion edge: along the straight cushions, then on along the cut walls (not across the mouths)
    const ol = mk(), oc = ol.getContext('2d');
    oc.strokeStyle = CUSHION_EDGE; oc.lineWidth = 2;
    oc.beginPath(); oc.moveTo(L, T); oc.lineTo(R, T); oc.lineTo(R, B); oc.lineTo(L, B); oc.closePath(); oc.stroke();
    oc.fillStyle = '#000'; oc.globalCompositeOperation = 'destination-out';
    for (const p of POCKETS) { polyPath(oc, p.poly); oc.fill(); }
    oc.globalCompositeOperation = 'source-over';
    for (const p of POCKETS) {
      oc.lineCap = 'butt';
      for (const e of p.edges) { oc.beginPath(); oc.moveTo(e.x1, e.y1); oc.lineTo(e.x2, e.y2); oc.stroke(); }
      oc.lineCap = 'round';                              // close the tiny gap where the straight edge line meets the cut wall
      for (const e of p.edges) { oc.beginPath(); oc.moveTo(e.x1, e.y1); oc.lineTo(e.x1 + e.rx * 4, e.y1 + e.ry * 4); oc.stroke(); }
    }
    c.drawImage(ol, 0, 0);
    c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(L + 250, T); c.lineTo(L + 250, B); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.25)';
    for (const sx of [L + 250, L + (R - L) * 0.75]) { c.beginPath(); c.arc(sx, CY, 3, 0, Math.PI * 2); c.fill(); }
    // 4) the real pocket is the circle
    for (const p of POCKETS) {
      const hg = c.createRadialGradient(p.x, p.y + p.r * 0.35, p.r * 0.1, p.x, p.y, p.r);
      hg.addColorStop(0, '#000000'); hg.addColorStop(0.55, '#050101'); hg.addColorStop(1, '#4a0505');
      c.fillStyle = hg; c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = '#e8dcc0';
    const dia = (x, y) => { c.beginPath(); c.moveTo(x, y - 5); c.lineTo(x + 5, y); c.lineTo(x, y + 5); c.lineTo(x - 5, y); c.closePath(); c.fill(); };
    for (let i = 1; i < 8; i++) { if (i === 4) continue; const x = L + (R - L) * i / 8; dia(x, T - 40); dia(x, B + 40); }
    for (let i = 1; i < 4; i++) { const y = T + (B - T) * i / 4; dia(L - 40, y); dia(R + 40, y); }
    t.refresh();
  }
}

/* =====================================================================
   PART 2b - Rolling balls: every ball is a real 3D sphere with its own orientation.
   The number / stripe is wrapped on a sphere (equirectangular source) and re-rendered each frame
   from the ball's rotation matrix, so it really ROLLS (and the cue ball visibly skids, follows, draws).
   Coordinates: x right, y down, z into the screen (visible side is z < 0).
   ===================================================================== */
const EQW = 256, EQH = 128, RS = 56;               // source map size, rendered ball size (px)
const BALL_COLS = [null, '#f5c518', '#1d4ed8', '#dc2626', '#7e22ce', '#f97316', '#15803d', '#7f1d1d', '#111111'];

function buildEquirect(n) {
  const cv = document.createElement('canvas'); cv.width = EQW; cv.height = EQH;
  const c = cv.getContext('2d');
  const col = n === 0 ? '#ffffff' : BALL_COLS[n > 8 ? n - 8 : n];
  if (n > 8) {
    c.fillStyle = '#f4f1e8'; c.fillRect(0, 0, EQW, EQH);
    c.fillStyle = col; c.fillRect(0, EQH * 0.31, EQW, EQH * 0.38);
  } else { c.fillStyle = col; c.fillRect(0, 0, EQW, EQH); }
  for (const x of [EQW / 2, 0, EQW]) {              // number discs on opposite sides (x = 0 and EQW are the same meridian)
    if (n > 0) {
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x, EQH / 2, 17, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#111'; c.font = 'bold 22px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(n), x, EQH / 2 + 1);
    } else {
      c.fillStyle = '#d33'; c.beginPath(); c.arc(x, EQH / 2, 4, 0, Math.PI * 2); c.fill();
    }
  }
  return c.getImageData(0, 0, EQW, EQH);
}

const MAT_I = [1, 0, 0, 0, 1, 0, 0, 0, 1];
function matMul(A, B) {
  const C = new Array(9).fill(0);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) for (let k = 0; k < 3; k++) C[i * 3 + j] += A[i * 3 + k] * B[k * 3 + j];
  return C;
}
function rotInc(wx, wy, wz, dt) {                    // Rodrigues: rotation by |w|*dt around w
  const m = Math.hypot(wx, wy, wz);
  if (m < 1e-9) return MAT_I;
  const th = m * dt, ax = wx / m, ay = wy / m, az = wz / m, c = Math.cos(th), s = Math.sin(th), t = 1 - c;
  return [t * ax * ax + c, t * ax * ay - s * az, t * ax * az + s * ay,
          t * ax * ay + s * az, t * ay * ay + c, t * ay * az - s * ax,
          t * ax * az - s * ay, t * ay * az + s * ax, t * az * az + c];
}
function orthonormalize(M) {                         // stop numeric drift
  let a = [M[0], M[1], M[2]], b = [M[3], M[4], M[5]];
  const la = Math.hypot(...a); a = a.map(x => x / la);
  const d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; b = [b[0] - d * a[0], b[1] - d * a[1], b[2] - d * a[2]];
  const lb = Math.hypot(...b); b = b.map(x => x / lb);
  const c = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  return [...a, ...b, ...c];
}
function renderSphere(out, eq, M) {                  // out: ImageData(RS,RS), eq: ImageData(EQW,EQH), M: body->world
  const d = out.data, e = eq.data, h = RS / 2;
  for (let py = 0; py < RS; py++) {
    const v = (py + 0.5 - h) / h;
    for (let px = 0; px < RS; px++) {
      const u = (px + 0.5 - h) / h, r2 = u * u + v * v, i = (py * RS + px) * 4;
      if (r2 >= 1) { d[i + 3] = 0; continue; }
      const z = -Math.sqrt(1 - r2);
      const qx = M[0] * u + M[3] * v + M[6] * z, qy = M[1] * u + M[4] * v + M[7] * z, qz = M[2] * u + M[5] * v + M[8] * z;
      const lon = Math.atan2(qx, -qz), lat = Math.asin(qy < -1 ? -1 : qy > 1 ? 1 : qy);
      let sx = ((lon / (2 * Math.PI) + 0.5) * EQW) | 0, sy = ((lat / Math.PI + 0.5) * EQH) | 0;
      if (sx >= EQW) sx = EQW - 1; if (sy >= EQH) sy = EQH - 1;
      const j = (sy * EQW + sx) * 4, a = (1 - Math.sqrt(r2)) * h;
      d[i] = e[j]; d[i + 1] = e[j + 1]; d[i + 2] = e[j + 2]; d[i + 3] = a >= 1 ? 255 : a * 255;
    }
  }
}

/* =====================================================================
   Telegram Mini App setup (safe to call outside Telegram: it does nothing)
   ===================================================================== */
/* The Telegram user (name etc.).  Tries the Telegram script first; if that script did not load (blocked network) or gave nothing,
   reads the same data straight from the launch parameters Telegram puts in the page address / session storage.
   Only available when the game is opened as a Mini App (bot menu button, t.me/bot/app link, web_app button), not as a plain link. */
function getTelegramUser() {
  try { const u = window.Telegram.WebApp.initDataUnsafe.user; if (u) return u; } catch (e) {}
  const fromData = d => { const u = new URLSearchParams(d).get('user'); return u ? JSON.parse(u) : null; };
  try { const d = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData'); if (d) { const u = fromData(d); if (u) return u; } } catch (e) {}
  try { const o = JSON.parse(sessionStorage.getItem('__telegram__initParams') || 'null'); if (o && o.tgWebAppData) { const u = fromData(o.tgWebAppData); if (u) return u; } } catch (e) {}
  return null;
}
function initTelegram() {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  const ok = v => { try { return tg.isVersionAtLeast(v); } catch (e) { return false; } };
  const safe = f => { try { f(); } catch (e) {} };
  safe(() => tg.ready());
  safe(() => tg.expand());
  if (ok('7.7')) safe(() => tg.disableVerticalSwipes());          // dragging down must not close the app
  if (ok('6.1')) { safe(() => tg.setHeaderColor('#0b130f')); safe(() => tg.setBackgroundColor('#0b130f')); }
  // optional full screen for testing: open the app with ?fs=1 at the end of its link
  if (ok('8.0') && /[?&]fs=1/.test(location.search)) safe(() => tg.requestFullscreen());
}

/* =====================================================================
   PART 3 - Phaser scene: rendering, input, sound, turns
   ===================================================================== */
/* Left column (left thumb): settings gear on top, then the power cue.  The cue is the power slider: pull it down to set the power, let go to shoot.
   SLIDER.y0..y1 = how far the cue tip travels.  GEAR / MENU = settings button and its pop-up panel. */
const SLIDER = { x: 42, y0: 150, y1: 590, zoneW: 80 };
const GEAR = { x: 42, y: 82, r: 20 };
const MENU = { x: 100, y: 66, w: 230, rowH: 46 };
const CUE_LEN = 520;
/* Ball return rail (right column): a potted ball is swallowed by its pocket, comes out of the tube at the top of the rail (same size as on the table),
   rolls down the rail and piles up from the bottom.
   RAIL.x = rail centre, inX = where a ball enters the tube, top = height of the tube, slot0 = centre of the first (lowest) ball, dy = spacing,
   hw = half width of the groove (a ball is 2*BR wide), wall = thickness of the chrome tubes.   RAIL_TIME: 1 = normal, 2 = twice as slow, 0.5 = twice as fast. */
const RAIL = { x: 1238, inX: 1214, mouth: 1196.5, top: 112, bottom: 598, slot0: 577, dy: 30.5, hw: 17, wall: 6 };
const RAIL_TIME = 1;
const SPIN = { x: 1238, y: 656, r: 32 };          // cue-ball contact dial (tip position on the ball)
/* Top bar (one row, y = BAR_Y), left to right:  7 ball slots | name | avatar+turn ring | score + entry | avatar | name | 7 slots.
   Ball slots fill from the outer edge inwards.  Everything is positioned from these numbers. */
const BAR_Y = 28, SLOT_D = 22, SLOT_DX = 26, SLOT0 = 96, SLOT1 = 1184;   // slot size, spacing, first-slot centre of player 1 / player 2
const AV_X = [470, 810], AV_R = 19, AV_COL = [0x2f6fdb, 0xd9822b];       // avatar centres, radius, colours
const TURN_TIME = 30, TURN_WARN = 8;                                      // seconds per turn; the ring turns red and ticks during the last TURN_WARN seconds
const ENTRY_LABEL = 'FREE';                                              // league entry shown under the score (placeholder until leagues exist)
const AIM_SENS = 1, AIM_MIN_R = 30;               // aiming feel (see setAim)
const HEAD_X = L + 250;                           // head string (break placement limit)

class Main extends Phaser.Scene {
  create() {
    buildTextures(this);
    this.loadSamples();
    this.eq = []; this.rollCtx = []; this.rollOut = []; this.ori = [];
    for (let n = 0; n <= 15; n++) {                // one rolling-sphere texture per ball number
      this.eq[n] = buildEquirect(n);
      const t = this.textures.createCanvas('roll' + n, RS, RS);
      this.rollCtx[n] = t; this.rollOut[n] = t.getContext().createImageData(RS, RS);
      this.ori[n] = MAT_I;
    }
    this.sim = new Sim();
    this.rules = new Rules();
    this.state = 'aim';                           // 'aim' | 'moving' | 'over'
    this.acc = 0;
    this.aimAngle = 0; this.power = 0; this.top = 0; this.side = 0;
    this.aiming = false; this.sliding = false; this.spinning = false; this.dragCue = false;
    this.shotLog = []; this.before = new Set();
    this.potted = []; this.trayImgs = {};

    this.add.image(0, 0, 'table').setOrigin(0).setDepth(0);

    this.spr = this.sim.balls.map(b => ({
      shadow: this.add.image(0, 0, 'shadow').setDepth(1).setDisplaySize(BR * 3.4, BR * 3.4),
      ball: this.add.image(0, 0, 'roll' + b.n).setDepth(2).setDisplaySize(BR * 2, BR * 2),
      shine: this.add.image(0, 0, 'shine').setDepth(3).setDisplaySize(BR * 2, BR * 2)
    }));

    this.g = this.add.graphics().setDepth(5);
    this.ui = this.add.graphics().setDepth(10);

    this.ringG = this.add.graphics().setDepth(10);                               // live turn-timer ring (redrawn every frame)
    this.turnLeft = TURN_TIME;
    this.railCount = 0;
    /* Two masks (used only while a ball moves, to keep the game fast):
       fallMask  = the cloth + the pocket cuts + the pocket circles: a falling ball is hidden as soon as it leaves them, as if it went under the table.
       railMask  = everything right of the table frame: a ball coming out of the tube is only visible once it is out from under the frame. */
    const mkMask = draw => { const g = this.make.graphics({ x: 0, y: 0, add: false }); g.fillStyle(0xffffff, 1); draw(g); return g.createGeometryMask(); };
    this.fallMask = mkMask(g => { g.fillRect(L, T, R - L, B - T); for (const q of POCKETS) { g.fillPoints(q.poly, true); g.fillCircle(q.x, q.y, q.r); } });
    this.railMask = mkMask(g => g.fillRect(RAIL.mouth, 60, 1280 - RAIL.mouth, 660));
    this.buildRail();
    this.hud = this.add.graphics().setDepth(9);                                  // bar background, slots, avatars, turn rings (redrawn in refreshHud)
    this.score = [0, 0];
    const tgUser = getTelegramUser();
    const clip = n => n.length > 12 ? n.slice(0, 11) + '…' : n;
    this.names = [clip(tgUser ? (tgUser.first_name || tgUser.username || 'Player 1') : 'Player 1'), 'Player 2'];
    const nf = { fontFamily: 'Arial', fontSize: '20px', color: '#cfe8d6' }, gf = { fontFamily: 'Arial', fontSize: '12px', color: '#8fb39b' };
    this.nameT = [0, 1].map(i => this.add.text(AV_X[i] + (i ? 1 : -1) * 32, BAR_Y - 7, this.names[i], nf).setOrigin(i ? 0 : 1, 0.5).setDepth(11));
    this.groupT = [0, 1].map(i => this.add.text(AV_X[i] + (i ? 1 : -1) * 32, BAR_Y + 12, '', gf).setOrigin(i ? 0 : 1, 0.5).setDepth(11));
    this.letterT = [0, 1].map(i => this.add.text(AV_X[i], BAR_Y, this.names[i].charAt(0).toUpperCase(), { fontFamily: 'Arial', fontSize: '22px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5).setDepth(11));
    this.avImg = [null, null];
    if (tgUser && tgUser.photo_url) this.loadAvatar(0, tgUser.photo_url);      // profile photo replaces the letter when it loads
    this.scoreT = this.add.text(CX, BAR_Y - 8, '0 - 0', { fontFamily: 'Arial', fontSize: '24px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5).setDepth(11);
    this.entryT = this.add.text(CX, BAR_Y + 13, ENTRY_LABEL, { fontFamily: 'Arial', fontSize: '14px', fontStyle: 'bold', color: '#ffd166' }).setOrigin(0.5).setDepth(11);
    this.msg = this.add.text(CX, 706, '', { fontFamily: 'Arial', fontSize: '19px', color: '#ffd166' }).setOrigin(0.5).setDepth(10);
    const lf = { fontFamily: 'Arial', fontSize: '13px', color: '#cfe8d6' };
    this.add.text(SPIN.x, SPIN.y - SPIN.r - 14, 'SPIN', lf).setOrigin(0.5).setDepth(10);

    // debug overlay: knuckles (red), capture circles (yellow), cue-ball centre limits on the cushions (cyan)
    this.showJaws = false;
    this.dbg = this.add.graphics().setDepth(4);
    const drawDbg = () => {
      const d = this.dbg; d.clear();
      if (!this.showJaws) return;
      d.lineStyle(2, 0xff4d4d, 1); JAWS.forEach(j => d.strokeCircle(j.x, j.y, JAW_R));
      d.lineStyle(1, 0xffe14d, 0.8); POCKETS.forEach(p => d.strokeCircle(p.x, p.y, p.r));
      d.lineStyle(2, 0xff9f43, 1); WALLS.forEach(w => d.lineBetween(w.x1, w.y1, w.x2, w.y2));
      d.lineStyle(1, 0x4dd9ff, 0.8);
      d.lineBetween(L + JC, T + BR, CX - JS, T + BR); d.lineBetween(CX + JS, T + BR, R - JC, T + BR);
      d.lineBetween(L + JC, B - BR, CX - JS, B - BR); d.lineBetween(CX + JS, B - BR, R - JC, B - BR);
      d.lineBetween(L + BR, T + JC, L + BR, B - JC); d.lineBetween(R - BR, T + JC, R - BR, B - JC);
    };
    drawDbg();
    this.toggleJaws = () => { this.showJaws = !this.showJaws; drawDbg(); this.drawMenu(); };
    if (this.input.keyboard) this.input.keyboard.on('keydown-J', this.toggleJaws);
    this.buildMenu();

    this.input.on('pointerdown', p => this.onDown(p));
    this.input.on('pointermove', p => this.onMove(p));
    this.input.on('pointerup', () => this.onUp());
    this.input.on('pointerupoutside', () => this.onUp());

    initTelegram();
    this.startGame();
  }

  /* ---------- game flow ---------- */
  startGame() {
    this.rules.reset();
    this.newRack();
    this.msg.setText('Break: drag the cue ball behind the line if you like, then aim');
  }

  newRack() {                                     // fresh sprites + balls (also used for a re-rack)
    this.sim.reset();
    this.sim.balls.forEach((b, i) => {
      const s = this.spr[i];
      s.ball.setTexture('roll' + b.n);
      this.resetSprite(s);
    });
    for (let n = 0; n <= 15; n++) {                // random start orientation: number faces the player, slightly turned
      this.ori[n] = rotInc(0, 0, Math.random() * Math.PI * 2, 1);
      this.drawRoll(n);
    }
    Object.values(this.trayImgs).forEach(i => i.destroy());
    this.trayImgs = {}; this.potted = [];
    this.railCount = 0;
    this.state = 'aim'; this.acc = 0; this.power = 0; this.top = 0; this.side = 0; this.turnLeft = TURN_TIME;
    this.aimAngle = 0;
    this.refreshHud();
  }

  refreshHud() {
    const gname = g => g === 'solid' ? 'Solids' : g === 'stripe' ? 'Stripes' : 'Open table';
    const h = this.hud; h.clear();
    for (const [x, w] of [[84, 190], [1006, 190]]) {                              // the two ball trays
      h.fillStyle(0x16241c, 0.9); h.fillRoundedRect(x, BAR_Y - 17, w, 34, 17);
    }
    h.fillStyle(0x16241c, 0.9); h.fillRoundedRect(CX - 120, BAR_Y - 21, 240, 42, 14);   // score / entry panel
    for (let i = 0; i < 7; i++) {                                                  // seven empty slots per player
      for (const x of [SLOT0 + i * SLOT_DX, SLOT1 - i * SLOT_DX]) {
        h.fillStyle(0x0b130f, 1); h.fillCircle(x, BAR_Y, SLOT_D / 2); h.lineStyle(1, 0x2a3d31, 1); h.strokeCircle(x, BAR_Y, SLOT_D / 2);
      }
    }
    for (let i = 0; i < 2; i++) {                                                  // avatar + turn ring
      const cur = this.rules.turn === i && this.rules.winner < 0;
      h.fillStyle(AV_COL[i], cur ? 1 : 0.55); h.fillCircle(AV_X[i], BAR_Y, AV_R);
      h.lineStyle(3, 0x2a3d31, 1); h.strokeCircle(AV_X[i], BAR_Y, AV_R + 4);   // dim track; the live timer ring is drawn on top every frame
      this.nameT[i].setColor(cur ? '#ffd166' : '#8fb39b');
      this.groupT[i].setText(gname(this.rules.groups[i]));
      this.letterT[i].setAlpha(cur ? 1 : 0.7);
      if (this.avImg[i]) this.avImg[i].setAlpha(cur ? 1 : 0.6);
    }
    this.scoreT.setText(this.score[0] + ' - ' + this.score[1]);
    this.layoutTrays();
  }

  /* Profile photo: loaded as a normal image, cropped to a circle and drawn over the letter avatar.
     If it cannot be loaded (no permission / blocked by the server's CORS rules) nothing happens and the letter stays. */
  loadAvatar(i, url) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const S = 96, side = Math.min(img.naturalWidth || S, img.naturalHeight || S) || S;
        const key = 'avatar' + i + '_' + Date.now();
        const t = this.textures.createCanvas(key, S, S), c = t.getContext();
        c.beginPath(); c.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); c.clip();
        c.drawImage(img, ((img.naturalWidth || S) - side) / 2, ((img.naturalHeight || S) - side) / 2, side, side, 0, 0, S, S);   // centre square crop
        t.refresh();
        if (this.avImg[i]) this.avImg[i].destroy();
        this.avImg[i] = this.add.image(AV_X[i], BAR_Y, key).setDisplaySize(AV_R * 2, AV_R * 2).setDepth(11);
        this.letterT[i].setVisible(false);
        this.refreshHud();
      } catch (e) {}
    };
    img.onerror = () => {};
    img.src = url;
  }

  layoutTrays() {                                  // potted balls go into the slots of the player whose group they belong to
    const lists = [[], []], g = this.rules.groups;
    for (const n of this.potted) {
      const img = this.trayImgs[n];
      if (!img) continue;
      if (n === 8 || !g[0]) { img.setVisible(false); continue; }                   // table still open (or the 8-ball): not shown in a tray
      lists[Rules.groupOf(n) === g[0] ? 0 : 1].push(n);
    }
    lists[0].forEach((n, i) => this.trayImgs[n].setVisible(true).setPosition(SLOT0 + i * SLOT_DX, BAR_Y));
    lists[1].forEach((n, i) => this.trayImgs[n].setVisible(true).setPosition(SLOT1 - i * SLOT_DX, BAR_Y));
  }

  finishShot() {
    const res = this.rules.evaluate(this.shotLog, this.before);
    this.state = 'aim'; this.turnLeft = TURN_TIME;   // a fresh 30 s for whoever shoots next (also when the same player continues)
    if (!this.sim.balls[0].active) this.respawnCue();
    this.top = 0; this.side = 0;                  // dial returns to the centre after every shot
    const who = i => 'Player ' + (i + 1);
    const prev = this._shooter;

    if (res.rerack) {
      this.rules.rerack(); this.newRack();
      this.msg.setText(who(this.rules.turn) + ' ' + res.reason);
      return;
    }
    if (this.rules.winner >= 0) {
      this.state = 'over'; this.score[this.rules.winner]++;
      const why = res.reason ? ' (' + res.reason + ')' : '';
      this.msg.setText(who(this.rules.winner) + ' wins!' + why + '  Tap the gear > New game to play again');
      this.refreshHud(); return;
    }
    let text;
    if (res.foul) text = 'Foul: ' + res.reason + '. ' + who(this.rules.turn) + ' has ball in hand';
    else if (res.continues) text = who(prev) + ' continues' + (res.assigned ? ' as ' + (this.rules.groups[prev] === 'solid' ? 'Solids' : 'Stripes') : '');
    else text = who(this.rules.turn) + "'s turn";
    if (res.assigned && !res.foul && !res.continues) text += ' (' + who(prev) + ' is ' + (this.rules.groups[prev] === 'solid' ? 'Solids' : 'Stripes') + ')';
    if (this.rules.ballInHand && !res.foul) text += ' - ball in hand';
    this.msg.setText(text);
    this.refreshHud();
  }

  respawnCue() {
    const c = this.sim.balls[0], s = this.spr[0];
    c.active = true; c.vx = 0; c.vy = 0; c.rvx = 0; c.rvy = 0; c.w = 0; c.x = HEAD_X; c.y = CY;
    let guard = 0;
    while (guard++ < 40 && this.sim.balls.some(o => o !== c && o.active && Math.hypot(o.x - c.x, o.y - c.y) < 2 * BR + 2)) c.x += 2 * BR + 2;
    this.resetSprite(s);                                       // also stops the "falling into pocket" animation
  }

  /* ---------- input ---------- */
  onDown(p) {
    if (Math.hypot(p.x - GEAR.x, p.y - GEAR.y) <= GEAR.r + 8) { this.toggleMenu(); return; }   // the settings gear works in every state
    if (this.menuOpen) { this.menuTap(p); return; }                                             // while the panel is open, touches only go to it
    if (this.state !== 'aim' || p.y < 60) return;
    if (Math.hypot(p.x - SPIN.x, p.y - SPIN.y) <= SPIN.r + 10) { this.spinning = true; this.setSpin(p); return; }
    if (p.x < SLIDER.zoneW && p.y > 108 && p.y < 668) {              // grab the cue anywhere in the left column: no jump, it moves with the finger from where it is
      this.sliding = true; this.powerGrab = p.y - (SLIDER.y0 + this.power * (SLIDER.y1 - SLIDER.y0)); return;
    }
    const c = this.sim.balls[0];
    if (this.rules.ballInHand && Math.hypot(p.x - c.x, p.y - c.y) < 28) { this.dragCue = true; return; }
    if (p.y > 668) return;                          // bottom band = message only
    this.aiming = true; this.aimBase = null; this.setAim(p);
  }
  onMove(p) {
    if (!p.isDown) return;
    if (this.dragCue) this.placeCue(p.x, p.y);
    else if (this.spinning) this.setSpin(p);
    else if (this.sliding) this.setPower(p.y - this.powerGrab);
    else if (this.aiming) this.setAim(p);
  }
  onUp() {
    if (this.sliding) {
      this.sliding = false;
      if (this.power > 0.04 && this.state === 'aim') this.fire();
      this.power = 0;
    }
    this.aiming = false; this.aimBase = null; this.spinning = false; this.dragCue = false;
  }
  /* Relative aiming: the finger only TURNS the cue by the angle it moves around the cue ball.
     Touching anywhere (also on the stick) changes nothing by itself; lifting and touching again continues from the
     current aim.  AIM_SENS = 1 means the stick follows the finger exactly; lower (e.g. 0.5) = finer, slower aiming.
     AIM_MIN_R: while the finger is closer than this to the cue ball its angle is too jumpy, so it is ignored. */
  setAim(p) {
    const c = this.sim.balls[0];
    if (Math.hypot(p.x - c.x, p.y - c.y) < AIM_MIN_R) return;
    const a = Math.atan2(p.y - c.y, p.x - c.x);
    if (!this.aimBase) { this.aimBase = { grab: a, angle: this.aimAngle }; return; }
    let d = a - this.aimBase.grab;
    d = Math.atan2(Math.sin(d), Math.cos(d));         // shortest way round, no jump at +-180 degrees
    this.aimAngle = this.aimBase.angle + d * AIM_SENS;
  }
  setPower(y) {
    this.power = Phaser.Math.Clamp((y - SLIDER.y0) / (SLIDER.y1 - SLIDER.y0), 0, 1);
  }
  setSpin(p) {
    let dx = (p.x - SPIN.x) / (SPIN.r * 0.82), dy = (p.y - SPIN.y) / (SPIN.r * 0.82);
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    if (m < 0.12) { dx = 0; dy = 0; }             // snap to centre
    this.side = dx; this.top = -dy;
  }
  placeCue(px, py) {                              // ball in hand: keep the cue ball legal while dragging
    const c = this.sim.balls[0];
    const maxX = this.rules.breakShot ? HEAD_X : R - BR;
    let x = Phaser.Math.Clamp(px, L + BR, maxX), y = Phaser.Math.Clamp(py, T + BR, B - BR);
    for (let k = 0; k < 2; k++) {
      for (const o of this.sim.balls) {
        if (o === c || !o.active) continue;
        const d = Math.hypot(x - o.x, y - o.y), m = 2 * BR + 1;
        if (d < m) { const q = m / (d || 1); x = o.x + (x - o.x) * q; y = o.y + (y - o.y) * q; }
      }
      for (const q of POCKETS) {
        const d = Math.hypot(x - q.x, y - q.y), m = q.r + BR + 4;
        if (d < m) { const z = m / (d || 1); x = q.x + (x - q.x) * z; y = q.y + (y - q.y) * z; }
      }
      x = Phaser.Math.Clamp(x, L + BR, maxX); y = Phaser.Math.Clamp(y, T + BR, B - BR);
    }
    c.x = x; c.y = y;
  }
  fire() {
    this.before = new Set(this.sim.balls.filter(b => b.active && b.n !== 0).map(b => b.n));
    this.shotLog = [];
    this._shooter = this.rules.turn;
    this.cueSound(this.power);
    this.sim.shoot(this.aimAngle, this.power, this.top, this.side);
    this.state = 'moving'; this.acc = 0;
    this.msg.setText('');
  }

  /* ---------- sound (tiny synth, no audio files) ----------
     ball-ball: a short click + a broad "tick" + a dull knock (no long pure tones: they sound like glass).
     The harder the hit, the louder AND brighter it gets, and every hit varies a little so it never sounds machine-made.
     cushion: a dull low thud.  pocket: a low drop.
     Tuning: SFX_VOL = master volume; for ball sounds change the frequencies in the 'ball' branch. */
  /* ---------- recorded sounds ---------- */
  loadSamples() {
    this.samples = {};
    const ctx = this.sound && this.sound.context;
    if (!ctx) return;
    for (const k in SFX_DATA) {
      try {
        const bin = atob(SFX_DATA[k]), u = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        ctx.decodeAudioData(u.buffer, buf => { this.samples[k] = buf; }, () => {});
      } catch (e) {}
    }
  }
  // one shared compressor so a break (many hits at once) stays clean instead of clipping
  sampleOut(ctx) {
    if (!this._master) {
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.12;
      comp.connect(ctx.destination); this._master = comp;
    }
    return this._master;
  }
  playSample(key, vol, rate) {
    const ctx = this.sound && this.sound.context, buf = this.samples && this.samples[key];
    if (!ctx || !buf) return false;
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf; src.playbackRate.value = rate; g.gain.value = Math.min(vol, 1.5);
    src.connect(g); g.connect(this.sampleOut(ctx)); src.start();
    return true;
  }
  cueSound(power) {                               // cue tip hitting the cue ball: weak or strong sample by shot power
    if (!this.soundOn) return;
    const strong = power >= 0.4;
    this.playSample(strong ? 'cueStrong' : 'cueWeak', SAMPLE_VOL * (0.45 + 0.55 * power), 0.97 + Math.random() * 0.06);
  }

  sfx(kind, v) {
    const ctx = this.sound && this.sound.context;
    if (!ctx || !this.soundOn) return;
    if (kind === 'pocket' && this.playSample('pocket', SAMPLE_VOL * POCKET_GAIN * (0.9 + Math.random() * 0.1), 0.97 + Math.random() * 0.06)) return;
    if (kind === 'ball' || kind === 'wall') {         // recorded sample first (harder hit = louder), synth is the fallback
      const lo = Math.min(1, Math.pow(Math.max(v, 0) / 1800, 0.6));
      if (this.playSample(kind === 'ball' ? 'ball' : 'cushion', SAMPLE_VOL * (0.1 + 0.9 * lo) * (kind === 'wall' ? CUSHION_GAIN : 1), 0.95 + Math.random() * 0.1)) return;
    }
    if (!this._noise) {                                              // one shared white-noise buffer
      const n = Math.floor(ctx.sampleRate * 0.15), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this._noise = buf;
    }
    const t0 = ctx.currentTime, out = ctx.destination;
    const loud = Math.min(1, Math.pow(Math.max(v, 0) / 1800, 0.6));   // 0..1
    const vol = SFX_VOL * (0.1 + 0.9 * loud);
    const env = (g, peak, dur) => { g.gain.setValueAtTime(peak, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); };
    const tone = (f, peak, dur) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f; env(g, peak, dur);
      o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.02);
    };
    const burst = (f, q, peak, dur, type) => {
      const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = this._noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q; env(g, peak, dur);
      src.connect(fl); fl.connect(g); g.connect(out); src.start(t0, Math.random() * 0.05); src.stop(t0 + dur + 0.02);
    };
    const j = 1 + (Math.random() - 0.5) * 0.1;
    if (kind === 'ball') {
      burst(2200, 0.5, vol * 0.22, 0.005, 'highpass');                 // the very short click of the contact
      burst(1300 + 900 * loud, 0.8, vol * 1.0, 0.024, 'bandpass');   // broad "tick" (no pure high tones: those sound like glass)
      tone(850 * j, vol * 0.7, 0.02); tone(520 * j, vol * 0.5, 0.035);   // dull body knock of a heavy resin ball
      tone(2300 * j, vol * 0.06, 0.012);                              // barely-there ring
    } else if (kind === 'wall') {
      burst(450, 0.7, vol * 0.9, 0.06, 'lowpass');
      tone(160 * j, vol * 0.7, 0.09); tone(95 * j, vol * 0.5, 0.12);
    } else {
      burst(320, 0.7, vol * 0.8, 0.15, 'lowpass');
      tone(120 * j, vol * 0.6, 0.2); tone(70 * j, vol * 0.4, 0.25);
    }
  }

  resetSprite(s) {                                // a ball sprite back to its normal look (after it was pocketed / sent down the rail)
    this.tweens.killTweensOf([s.ball, s.shine, s.shadow]);
    [s.ball, s.shine, s.shadow].forEach(o => o.clearMask());
    s.ball.setVisible(true).setAlpha(1).setAngle(0).setDepth(2).setDisplaySize(BR * 2, BR * 2);
    s.shine.setVisible(true).setAlpha(1).setDepth(3).setDisplaySize(BR * 2, BR * 2);
    s.shadow.setVisible(true).setAlpha(1).setDepth(1).setDisplaySize(BR * 3.4, BR * 3.4);
  }

  onPocket(b, p) {
    const i = this.sim.balls.indexOf(b), s = this.spr[i];
    if (b.n === 0) { this.fall(s, p); return; }    // cue ball: goes under the table, then is placed back on the table
    this.potted.push(b.n);
    this.trayImgs[b.n] = this.add.image(0, 0, 'ball' + b.n).setDepth(11).setDisplaySize(SLOT_D, SLOT_D);
    this.layoutTrays();
    this.railDrop(b, p);
  }

  /* ---------- frame loop ---------- */
  update(time, delta) {
    if (this.state === 'moving') {
      this.acc += Math.min(delta / 1000, 0.05);
      while (this.acc >= STEP) { this.sim.step(STEP); this.acc -= STEP; }
      let played = 0;
      for (const ev of this.sim.events.splice(0)) {
        if (ev.type === 'pocket') { this.shotLog.push({ type: 'pocket', n: ev.n }); this.onPocket(ev.ball, ev.pocket); this.sfx('pocket', 800); }
        else {
          if (ev.v > 8) this.shotLog.push({ type: ev.type, a: ev.a, b: ev.b, n: ev.n, v: ev.v });
          if (played < 4 && ev.v > 20) { this.sfx(ev.type, ev.v); played++; }
        }
      }
      if (!this.sim.isMoving()) this.finishShot();
    }
    this.tickTurn(Math.min(delta / 1000, 0.1));
    this.sync(Math.min(delta / 1000, 0.05));
    this.drawAim();
    this.drawRing();
    this.drawSlider();
    this.drawSpin();
  }

  /* ---------- turn timer ----------
     Counts down only while the player is aiming (not while the balls roll).  Last TURN_WARN seconds: red ring + a tick every second.
     At 0 the turn passes to the other player (no foul).  When the game goes online the server must own this clock. */
  tickTurn(dt) {
    if (this.state !== 'aim' || this.rules.winner >= 0) return;
    const prev = this.turnLeft;
    this.turnLeft = Math.max(0, prev - dt);
    if (this.turnLeft > 0 && this.turnLeft <= TURN_WARN && Math.ceil(this.turnLeft) < Math.ceil(prev)) this.tickSound(this.turnLeft <= 3);
    if (this.turnLeft <= 0) this.timeUp();
  }
  timeUp() {
    this.sliding = this.aiming = this.spinning = this.dragCue = false; this.aimBase = null; this.power = 0;
    this.top = 0; this.side = 0;
    this.rules.turn = 1 - this.rules.turn;
    this.turnLeft = TURN_TIME;
    this.msg.setText('Time is up: Player ' + (this.rules.turn + 1) + "'s turn" + (this.rules.ballInHand ? ' - ball in hand' : ''));
    this.refreshHud();
  }
  tickSound(urgent) {                              // short dry tick; higher and louder in the last 3 seconds
    const ctx = this.sound && this.sound.context;
    if (!ctx || !this.soundOn) return;
    const t0 = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = urgent ? 1900 : 1500;
    g.gain.setValueAtTime(SAMPLE_VOL * (urgent ? 0.16 : 0.1), t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.06);
  }
  drawRing() {                                     // the ring around the active avatar shrinks clockwise from the top as time runs out
    const r = this.ringG; r.clear();
    if (this.rules.winner >= 0) return;
    const f = Phaser.Math.Clamp(this.turnLeft / TURN_TIME, 0, 1), i = this.rules.turn;
    const warn = this.turnLeft <= TURN_WARN;
    r.lineStyle(3, warn ? 0xef4444 : 0x4ade80, 1);
    r.beginPath(); r.arc(AV_X[i], BAR_Y, AV_R + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f, false); r.strokePath();
  }

  drawRoll(n) {
    renderSphere(this.rollOut[n], this.eq[n], this.ori[n]);
    this.rollCtx[n].getContext().putImageData(this.rollOut[n], 0, 0);
    this.rollCtx[n].refresh();
  }

  sync(dt) {
    this.frame = (this.frame || 0) + 1;
    this.sim.balls.forEach((b, i) => {
      if (!b.active) return;
      const s = this.spr[i];
      s.ball.setPosition(b.x, b.y);
      s.shine.setPosition(b.x, b.y);
      s.shadow.setPosition(b.x + 3, b.y + 4);
      // rolling: top surface moves with the "roll velocity" (= v for a rolling ball, differs for a skidding cue ball)
      const rx = b.n === 0 ? b.rvx : b.vx, ry = b.n === 0 ? b.rvy : b.vy, wz = b.n === 0 ? b.w : 0;
      if (Math.abs(rx) + Math.abs(ry) + Math.abs(wz) < 3) return;
      let M = matMul(rotInc(ry / BR, -rx / BR, wz / BR, dt), this.ori[b.n]);
      if (this.frame % 60 === 0) M = orthonormalize(M);
      this.ori[b.n] = M;
      this.drawRoll(b.n);
    });
  }

  dashed(g, x0, y0, x1, y1) {
    const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    for (let d = 0; d < len; d += 16) {
      const e = Math.min(d + 8, len);
      g.lineBetween(x0 + ux * d, y0 + uy * d, x0 + ux * e, y0 + uy * e);
    }
  }

  drawAim() {
    const g = this.g; g.clear();
    const c = this.sim.balls[0];
    if (this.state !== 'aim' || !c.active) return;
    if (this.rules.ballInHand) { g.lineStyle(2, 0xffd166, 0.9); g.strokeCircle(c.x, c.y, BR + 7); }
    if (this.rules.breakShot && this.rules.ballInHand) { g.lineStyle(1, 0xffffff, 0.25); g.lineBetween(HEAD_X, T, HEAD_X, B); }
    const dx = Math.cos(this.aimAngle), dy = Math.sin(this.aimAngle);
    const hit = this.sim.rayHit(dx, dy);

    g.lineStyle(2, 0xffffff, 0.7);
    this.dashed(g, c.x + dx * BR, c.y + dy * BR, hit.x, hit.y);
    if (hit.kind !== 'none') { g.lineStyle(2, 0xffffff, 0.9); g.strokeCircle(hit.x, hit.y, BR); }

    if (hit.kind === 'ball') {                       // preview of the object ball + cue deflection
      let nx = hit.ball.x - hit.x, ny = hit.ball.y - hit.y;
      const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
      g.lineStyle(3, 0xffd166, 0.9);
      g.lineBetween(hit.ball.x, hit.ball.y, hit.ball.x + nx * 80, hit.ball.y + ny * 80);
      let tx = dx - (dx * nx + dy * ny) * nx, ty = dy - (dx * nx + dy * ny) * ny;
      const tl = Math.hypot(tx, ty);
      if (tl > 0.01) {
        tx /= tl; ty /= tl;
        g.lineStyle(2, 0xffffff, 0.5);
        g.lineBetween(hit.x, hit.y, hit.x + tx * 50, hit.y + ty * 50);
      }
    }

    // red dot on the cue ball = where the tip will hit (spin)
    g.fillStyle(0xd92b2b, 1);
    g.fillCircle(c.x + this.side * BR * 0.62, c.y - this.top * BR * 0.62, 2.6);

    // cue stick (pulls back with power)
    const pull = this.power * 80, tip = BR + 5 + pull, len = 340;
    const px = -dy, py = dx;
    const sx = c.x - dx * tip, sy = c.y - dy * tip;
    const mx = c.x - dx * (tip + len * 0.7), my = c.y - dy * (tip + len * 0.7);
    const ex = c.x - dx * (tip + len), ey = c.y - dy * (tip + len);
    g.fillStyle(0xe2b97a, 1);
    g.fillPoints([{ x: sx + px * 2.5, y: sy + py * 2.5 }, { x: mx + px * 4.5, y: my + py * 4.5 }, { x: mx - px * 4.5, y: my - py * 4.5 }, { x: sx - px * 2.5, y: sy - py * 2.5 }], true);
    g.fillStyle(0x3b2412, 1);
    g.fillPoints([{ x: mx + px * 4.5, y: my + py * 4.5 }, { x: ex + px * 7, y: ey + py * 7 }, { x: ex - px * 7, y: ey - py * 7 }, { x: mx - px * 4.5, y: my - py * 4.5 }], true);
    g.fillStyle(0xffffff, 1);
    g.fillPoints([{ x: sx + px * 2.5, y: sy + py * 2.5 }, { x: sx - dx * 8 + px * 2.7, y: sy - dy * 8 + py * 2.7 }, { x: sx - dx * 8 - px * 2.7, y: sy - dy * 8 - py * 2.7 }, { x: sx - px * 2.5, y: sy - py * 2.5 }], true);
  }

  drawSlider() {                                  // the power slider is a billiard cue; pulled down = more power
    const u = this.ui; u.clear();
    const { x, y0, y1 } = SLIDER, A = this.state === 'aim' ? 1 : 0.4;
    const hy = y0 + this.power * (y1 - y0);
    // groove + cue ball the tip points at
    u.fillStyle(0x0e1812, 0.92 * A); u.fillRoundedRect(x - 12, y0 - 30, 24, y1 - y0 + 52, 12);
    u.lineStyle(1, 0x2a3d31, A); u.strokeRoundedRect(x - 12, y0 - 30, 24, y1 - y0 + 52, 12);
    u.fillStyle(0xf6f3ea, A); u.fillCircle(x, y0 - 14, 9);
    u.fillStyle(0xd9d5c8, A); u.fillCircle(x + 2, y0 - 11, 6);
    u.fillStyle(0xffffff, 0.9 * A); u.fillCircle(x - 3, y0 - 18, 2.2);
    // power marks beside the cue: one per 10 %, lit up to the current power
    const col = this.power < 0.5 ? 0x4ade80 : this.power < 0.8 ? 0xfacc15 : 0xef4444;
    for (let i = 1; i <= 10; i++) {
      const lit = this.power >= i / 10 - 0.001 && this.power > 0;
      u.fillStyle(lit ? col : 0x2a3d31, A); u.fillCircle(x + 20, y0 + (y1 - y0) * i / 10, lit ? 3 : 2);
    }
    // the cue (tip at the top, butt below; it slides off the bottom of the screen when pulled far)
    const seg = (t1, h1, t2, h2, color) => {
      const ya = hy + t1, yb = hy + t2;
      u.fillStyle(color, A); u.fillPoints([{ x: x - h1, y: ya }, { x: x + h1, y: ya }, { x: x + h2, y: yb }, { x: x - h2, y: yb }], true);
      u.lineStyle(1.2, 0xffffff, 0.22 * A); u.lineBetween(x - h1 * 0.5, ya, x - h2 * 0.5, yb);      // light edge
      u.lineStyle(1.2, 0x000000, 0.25 * A); u.lineBetween(x + h1 * 0.6, ya, x + h2 * 0.6, yb);      // shade edge
    };
    u.fillStyle(0x3b78c4, A); u.fillCircle(x, hy + 2, 3.2);               // rounded chalked tip
    seg(2, 3.2, 8, 3.2, 0x3b78c4);                                        // tip
    seg(8, 3.3, 24, 3.5, 0xf4f1e8);                                       // ivory ferrule
    seg(24, 3.5, 300, 5.3, 0xecd29a);                                     // maple shaft
    seg(300, 5.6, 307, 5.6, 0xc9a74a);                                    // brass joint
    seg(307, 5.8, 352, 6.5, 0x6a3a1e);                                    // upper butt (dark wood)
    seg(352, 6.6, 432, 7.1, 0x1d1d1f);                                    // linen wrap
    u.lineStyle(1, 0x6b6b70, 0.45 * A);
    for (let t = 358; t < 430; t += 6) u.lineBetween(x - 6.8, hy + t, x + 6.8, hy + t + 2);      // wrap threads
    seg(432, 7.3, 438, 7.3, 0xc9a74a);                                    // brass ring
    seg(438, 7.3, CUE_LEN - 14, 7.9, 0x7a4426);                           // lower butt
    u.fillStyle(0xe8d59b, A);
    for (const t of [458, 480]) u.fillPoints([{ x, y: hy + t - 5 }, { x: x + 3, y: hy + t }, { x, y: hy + t + 5 }, { x: x - 3, y: hy + t }], true);   // inlays
    seg(CUE_LEN - 14, 7.9, CUE_LEN, 7.9, 0x151515);                       // rubber end
  }

  /* ---------- ball return rail ---------- */
  buildRail() {                                    // chrome tubes + wire-mesh floor + a cross bar per ball place
    const g = this.add.graphics().setDepth(8), R = RAIL, cx = R.x, hw = R.hw, wl = R.wall, mx = R.mouth;
    const ix0 = cx - hw, ix1 = cx + hw, ty0 = R.top - hw, ty1 = R.top + hw, bot = R.bottom, iy1 = bot - wl, ow = 2 * (hw + wl);
    const hline = (x0, x1, y, w, col, a) => { g.lineStyle(w, col, a); g.lineBetween(x0, y, x1, y); };
    const vline = (x, y0, y1, w, col, a) => { g.lineStyle(w, col, a); g.lineBetween(x, y0, x, y1); };
    g.fillStyle(0x000000, 0.35); g.fillRoundedRect(cx - hw - wl + 3, ty0 - wl + 4, ow, bot - ty0 + wl, 16);        // soft shadow
    g.fillStyle(0x7b868e, 1);                                                                                         // chrome body
    g.fillRoundedRect(cx - hw - wl, ty0 - wl, ow, bot - ty0 + wl, 16);
    g.fillRect(mx, ty0 - wl, cx - mx + 4, ow);
    g.fillStyle(0x0c1511, 1);                                                                                         // dark groove
    g.fillRoundedRect(ix0, ty0, 2 * hw, iy1 - ty0, 12);
    g.fillRect(mx, ty0, ix0 - mx + 14, 2 * hw);
    const mesh = (x0, y0, x1, y1) => {                                                                                // diagonal wire grid on one global grid, cut to the rectangle
      g.lineStyle(1.2, 0x8a959d, 0.8);
      for (let c = Math.floor((x0 - y1) / 9) * 9; c <= x1 - y0; c += 9) {                                              // lines y = x - c
        const xa = Math.max(x0, y0 + c), xb = Math.min(x1, y1 + c);
        if (xb > xa) g.lineBetween(xa, xa - c, xb, xb - c);
      }
      for (let c = Math.floor((x0 + y0) / 9) * 9; c <= x1 + y1; c += 9) {                                              // lines y = c - x
        const xa = Math.max(x0, c - y1), xb = Math.min(x1, c - y0);
        if (xb > xa) g.lineBetween(xa, c - xa, xb, c - xb);
      }
    };
    mesh(ix0 + 1, ty0 + 1, ix1 - 1, iy1 - 1);
    mesh(mx + 1, ty0 + 1, ix0 + 1, ty1 - 1);
    for (let k = 0; k <= 15; k++) hline(ix0 + 1, ix1 - 1, R.slot0 + R.dy / 2 - k * R.dy, 2, 0x4a555d, 0.9);          // cross bar between ball places
    // chrome highlights (light on the upper / left edge of each tube, dark on the lower / right edge)
    vline(cx - hw - wl + 1.6, ty1 + 4, bot - 10, 1.6, 0xeaf0f3, 0.8); vline(ix0 - 1.2, ty1 + 2, iy1 - 4, 1.4, 0x3d474e, 0.9);
    vline(ix1 + 1.6, ty0 + 8, iy1 - 4, 1.4, 0xcfd8dd, 0.55);          vline(cx + hw + wl - 1.6, ty0 + 8, bot - 10, 1.6, 0x3d474e, 0.9);
    hline(mx + 2, cx + hw + wl - 12, ty0 - wl + 1.6, 1.6, 0xeaf0f3, 0.8); hline(mx + 2, cx + hw + wl - 12, ty0 - 1.2, 1.4, 0x3d474e, 0.9);
    hline(mx + 2, cx - hw - wl - 2, ty1 + 1.6, 1.4, 0xcfd8dd, 0.55);    hline(mx + 2, cx - hw - wl - 2, ty1 + wl - 1.6, 1.6, 0x3d474e, 0.9);
    hline(ix0 + 6, ix1 - 6, iy1 + 1.6, 1.4, 0xcfd8dd, 0.6);             hline(ix0 + 6, ix1 - 6, bot - 1.6, 1.6, 0x3d474e, 0.9);
    g.fillStyle(0x5b656c, 1); g.fillRect(mx, ty0 - wl, 3, ow);                                                         // end plate where the tube meets the table frame
    g.fillStyle(0xdfe6ea, 1);                                                                                         // rivets
    for (let k = 1; k < 16; k += 3) { const y = R.slot0 - k * R.dy + R.dy / 2; if (y > ty1 + 14) { g.fillCircle(cx - hw - wl / 2, y, 1.7); g.fillCircle(cx + hw + wl / 2, y, 1.7); } }
    g.fillCircle(cx - hw - wl / 2, iy1 + wl / 2, 1.7); g.fillCircle(cx + hw + wl / 2, iy1 + wl / 2, 1.7);
  }
  fall(s, p, done) {                               // the ball rolls into the hole, then slips under the table toward the INSIDE of the table (hidden by the hole-circle mask, no fading / shrinking)
    const T = RAIL_TIME, objs = [s.ball, s.shine, s.shadow];
    let dx = p.x - s.ball.x, dy = p.y - s.ball.y;
    const d = Math.hypot(dx, dy);
    let ix = 640 - p.x, iy = 360 - p.y; const il = Math.hypot(ix, iy) || 1; ix /= il; iy /= il;   // inward = toward the table centre
    const run = p.r + BR + 4;
    if (!p.holeMask) p.holeMask = mkHoleMask(this, p);
    objs.forEach(o => o.setMask(this.fallMask));
    const finish = () => { objs.forEach(o => { o.setVisible(false); o.clearMask(); }); if (done) done(); };
    const phase2 = () => {
      objs.forEach(o => o.setMask(p.holeMask));
      this.tweens.add({ targets: objs, x: '+=' + ix * run, y: '+=' + iy * run, duration: run / 0.16 * T, ease: 'Quad.easeIn', onComplete: finish });
    };
    if (d < 1) phase2();
    else this.tweens.add({ targets: objs, x: '+=' + dx, y: '+=' + dy, duration: d / 0.22 * T, ease: 'Quad.easeIn', onComplete: phase2 });
  }
  railDrop(b, p) {                                 // after the fall the ball travels under the table and comes out of the tube (same size), then rolls down to its place
    const s = this.spr[this.sim.balls.indexOf(b)], R = RAIL, T = RAIL_TIME, objs = [s.ball, s.shine];
    const dist = Math.hypot(p.x - R.inX, p.y - R.top);
    this.fall(s, p, () => this.tweens.add({ targets: s.ball, alpha: 1, duration: (300 + dist * 0.45) * T,                       // hidden: travelling under the table
      onComplete: () => {
        const ty = R.slot0 - this.railCount++ * R.dy, drop = ty - R.top, dur = (1000 + drop * 3.4) * T;
        s.ball.setDepth(12).setVisible(true).setMask(this.railMask); s.shine.setDepth(13).setVisible(true).setMask(this.railMask);
        objs.forEach(o => o.setPosition(R.mouth - BR - 1, R.top));                                                              // starts hidden behind the table frame
        this.tweens.add({ targets: objs, x: R.x, duration: 700 * T, ease: 'Sine.easeInOut', onComplete: () => {                 // rolls out of the tube into the rail
          objs.forEach(o => o.clearMask());
          this.tweens.add({ targets: s.ball, angle: s.ball.angle + drop / BR * 57.3, duration: dur, ease: 'Quad.easeIn' });
          this.tweens.add({ targets: objs, y: ty, duration: dur, ease: 'Quad.easeIn',                                            // ...and down
            onComplete: () => this.tweens.add({ targets: objs, y: ty - 3, duration: 120, yoyo: true, ease: 'Sine.easeOut' }) });
        } });
      } }));
  }

  /* ---------- settings (gear, top left) ----------
     Pop-up with: sound on/off (remembered), show the pocket jaws (debug), new game. */
  buildMenu() {
    this.menuOpen = false;
    try { this.soundOn = localStorage.getItem('pool_sound') !== '0'; } catch (e) { this.soundOn = true; }
    this.gearG = this.add.graphics().setDepth(12);
    this.menuG = this.add.graphics().setDepth(20);
    const f = { fontFamily: 'Arial', fontSize: '19px', color: '#e7f3ea' };
    this.menuT = [0, 1, 2].map(i => this.add.text(MENU.x + 18, MENU.y + 8 + i * MENU.rowH + MENU.rowH / 2, '', f).setOrigin(0, 0.5).setDepth(21).setVisible(false));
    this.drawMenu();
  }
  toggleMenu() { this.menuOpen = !this.menuOpen; this.drawMenu(); }
  menuTap(p) {
    const inside = p.x >= MENU.x && p.x <= MENU.x + MENU.w && p.y >= MENU.y && p.y <= MENU.y + 16 + 3 * MENU.rowH;
    if (!inside) { this.menuOpen = false; this.drawMenu(); return; }
    const row = Math.floor((p.y - MENU.y - 8) / MENU.rowH);
    if (row === 0) { this.soundOn = !this.soundOn; try { localStorage.setItem('pool_sound', this.soundOn ? '1' : '0'); } catch (e) {} }
    else if (row === 1) this.toggleJaws();
    else if (row === 2) { this.menuOpen = false; this.startGame(); }
    this.drawMenu();
  }
  drawMenu() {
    const g = this.gearG; g.clear();
    const { x, y, r } = GEAR, open = this.menuOpen;
    g.fillStyle(0x16241c, 0.92); g.fillCircle(x, y, r); g.lineStyle(2, open ? 0x4ade80 : 0x2a3d31, 1); g.strokeCircle(x, y, r);
    g.fillStyle(0xcfe8d6, 1); g.fillCircle(x, y, 7.5);                                          // gear: body, 8 teeth, hole
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, c = Math.cos(a), s = Math.sin(a), px = -s * 2.6, py = c * 2.6;
      g.fillPoints([{ x: x + c * 6 + px, y: y + s * 6 + py }, { x: x + c * 11.5 + px, y: y + s * 11.5 + py }, { x: x + c * 11.5 - px, y: y + s * 11.5 - py }, { x: x + c * 6 - px, y: y + s * 6 - py }], true);
    }
    g.fillStyle(0x16241c, 1); g.fillCircle(x, y, 3.6);
    const m = this.menuG; m.clear();
    this.menuT.forEach(t => t.setVisible(open));
    if (!open) return;
    const h = 16 + 3 * MENU.rowH;
    m.fillStyle(0x16241c, 0.97); m.fillRoundedRect(MENU.x, MENU.y, MENU.w, h, 14);
    m.lineStyle(2, 0x2a3d31, 1); m.strokeRoundedRect(MENU.x, MENU.y, MENU.w, h, 14);
    m.lineStyle(1, 0x2a3d31, 1);
    for (let i = 1; i < 3; i++) m.lineBetween(MENU.x + 12, MENU.y + 8 + i * MENU.rowH, MENU.x + MENU.w - 12, MENU.y + 8 + i * MENU.rowH);
    this.menuT[0].setText('Sound: ' + (this.soundOn ? 'ON' : 'OFF')).setColor(this.soundOn ? '#e7f3ea' : '#8fb39b');
    this.menuT[1].setText('Show jaws: ' + (this.showJaws ? 'ON' : 'OFF'));
    this.menuT[2].setText('New game').setColor('#ffd166');
  }

  drawSpin() {                                    // drawn on the same graphics object, after the slider
    const u = this.ui, { x, y, r } = SPIN, a = this.state === 'aim' ? 1 : 0.4;
    u.fillStyle(0x16241c, a); u.fillCircle(x, y, r + 4);
    u.fillStyle(0xf6f3ea, a); u.fillCircle(x, y, r);
    u.lineStyle(1, 0x9a9a9a, 0.8 * a);
    u.lineBetween(x - r, y, x + r, y); u.lineBetween(x, y - r, x, y + r); u.strokeCircle(x, y, r * 0.5);
    u.fillStyle(0xd92b2b, a); u.fillCircle(x + this.side * r * 0.82, y - this.top * r * 0.82, 6);
  }
}

/* Upright phone: the page is rotated by CSS, so touch positions must be rotated back into table coordinates.
   (table x runs down the screen, table y runs from the right edge to the left edge) */
function fixPortraitTouch(game) {
  const im = game.input, mq = window.matchMedia('(orientation: portrait)'), orig = im.transformPointer;
  // size: Phaser measures its parent with getBoundingClientRect(), which is the rotated box; use the real layout size instead
  const sm = game.scale, origBounds = sm.getParentBounds;
  sm.getParentBounds = function () {
    if (!mq.matches || !this.parent) return origBounds.call(this);
    const ps = this.parentSize, w = this.parent.offsetWidth, h = this.parent.offsetHeight;
    if (ps.width !== w || ps.height !== h) { ps.setSize(w, h); return true; }
    return false;
  };
  const origCenter = sm.updateCenter;                       // centring has the same problem: use the canvas CSS size
  sm.updateCenter = function () {
    if (!mq.matches) return origCenter.call(this);
    const st = this.canvas.style, w = parseFloat(st.width) || this.canvas.width, h = parseFloat(st.height) || this.canvas.height;
    st.marginLeft = Math.floor((this.parentSize.width - w) / 2) + 'px';
    st.marginTop = Math.floor((this.parentSize.height - h) / 2) + 'px';
  };
  sm.getParentBounds(); sm.refresh();
  im.transformPointer = function (pointer, pageX, pageY, wasMove) {
    if (!mq.matches) return orig.call(this, pointer, pageX, pageY, wasMove);
    const r = game.canvas.getBoundingClientRect();
    const x = (pageY - window.pageYOffset - r.top) / r.height * game.config.width;
    const y = (r.right - (pageX - window.pageXOffset)) / r.width * game.config.height;
    const p0 = pointer.position, p1 = pointer.prevPosition, a = pointer.smoothFactor;
    p1.x = p0.x; p1.y = p0.y;
    if (!wasMove || a === 0) { p0.x = x; p0.y = y; }
    else { p0.x = x * a + p1.x * (1 - a); p0.y = y * a + p1.y * (1 - a); }
  };
}

new Phaser.Game({
  callbacks: { postBoot: fixPortraitTouch },
  type: Phaser.AUTO,
  parent: 'game',
  width: W, height: H,
  backgroundColor: '#0b130f',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  render: { antialias: true },
  input: { activePointers: 3 },
  scene: Main
});
</script>
